<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#c9ecf4">
<title>SKIMBA — Alpine Rush</title>
<style>
:root{--ink:#15333d;--cream:#fffaf0;--coral:#ff715b;--teal:#51b8b2;--yellow:#f6cb65;--muted:#54757b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9f1f3;color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,Segoe UI,sans-serif}body{user-select:none;-webkit-user-select:none;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;padding:calc(18px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;justify-content:space-between}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand{font-weight:1000;font-size:clamp(20px,3vw,31px);letter-spacing:.12em;text-shadow:0 2px #fff;line-height:1}.brand small{display:block;color:#528087;font-size:9px;letter-spacing:.24em;margin-top:5px}.stats{display:flex;gap:9px}.pill{border:2px solid rgba(255,255,255,.92);background:rgba(255,250,240,.86);border-radius:16px;padding:8px 13px;min-width:76px;text-align:center;box-shadow:0 4px 0 rgba(37,84,89,.1);backdrop-filter:blur(8px)}.pill label{display:block;font-size:8px;letter-spacing:.18em;font-weight:900;color:#6b8c8c}.pill strong{font-size:18px;font-weight:1000;line-height:1.2}.actions{display:flex;justify-content:space-between;align-items:flex-end}.icon-btn,.touch-btn{pointer-events:auto;border:2px solid rgba(255,255,255,.95);background:rgba(255,250,240,.88);color:var(--ink);font:900 15px inherit;border-radius:14px;min-height:44px;padding:0 14px;box-shadow:0 4px 0 rgba(37,84,89,.14);cursor:pointer;touch-action:manipulation}.icon-btn{font-size:20px;width:46px;padding:0}.touch-hint{font-weight:900;font-size:11px;letter-spacing:.08em;color:#48777d;text-shadow:0 1px #fff;align-self:center}.touch-controls{display:none;gap:10px}.touch-btn{width:62px;height:58px;font-size:24px;padding:0;border-radius:19px;background:rgba(255,250,240,.8)}.touch-btn.jump{font-size:12px;letter-spacing:.08em;width:74px;color:#a75649}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;pointer-events:auto;background:rgba(24,64,76,.08);backdrop-filter:blur(3px);transition:opacity .2s}.overlay.hidden{opacity:0;pointer-events:none}.card{width:min(440px,100%);border:3px solid white;border-radius:30px;background:rgba(255,250,240,.96);padding:clamp(23px,5vw,39px);box-shadow:0 12px 0 rgba(27,76,83,.14),0 25px 70px rgba(32,75,83,.2);text-align:center;position:relative;overflow:hidden}.card:before{content:"";position:absolute;z-index:0;width:210px;height:210px;border-radius:50%;background:#c9ecdf;top:-135px;right:-60px}.card>*{position:relative}.eyebrow{font-size:10px;letter-spacing:.24em;font-weight:1000;color:#50918f}.title{font-weight:1000;letter-spacing:.04em;font-size:clamp(47px,12vw,76px);line-height:.96;color:#153a43;margin:8px 0}.title span{color:var(--coral)}.subtitle{color:#648286;font-size:14px;line-height:1.5;margin:12px auto 22px;max-width:310px;font-weight:650}.primary{border:0;border-radius:17px;background:var(--coral);color:white;padding:16px 27px;font:1000 14px inherit;letter-spacing:.13em;box-shadow:0 5px 0 #d85345;cursor:pointer;transition:transform .12s,box-shadow .12s;width:min(250px,100%)}.primary:active{transform:translateY(4px);box-shadow:0 1px 0 #d85345}.key-row{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:19px;color:#789393;font-size:11px;font-weight:800}.key{background:white;border:1px solid #d6e5df;border-radius:7px;padding:4px 7px;color:#335d61;font-size:10px;box-shadow:0 2px 0 #dce8e2}.result{font-size:48px;font-weight:1000;margin:6px 0;color:#153a43}.result-label{font-size:10px;letter-spacing:.2em;color:#719093;font-weight:1000}.badge{display:inline-block;margin:5px 0 15px;padding:7px 12px;border-radius:99px;background:#e2f4e8;color:#44877b;font-size:10px;font-weight:1000;letter-spacing:.1em}.mobile .touch-controls{display:flex}.mobile .touch-hint{display:none}@media(max-width:520px){#ui{padding-left:12px;padding-right:12px}.stats{gap:5px}.pill{min-width:60px;padding:7px 9px}.pill strong{font-size:16px}.brand{font-size:20px}.brand small{font-size:8px}.touch-controls{display:flex!important}.touch-hint{display:none}.actions{align-items:flex-end}.topbar{gap:4px}.overlay{padding:14px}.card{border-radius:25px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Skimba alpine skiing game"></canvas>
<div id="ui">
  <div class="topbar"><div class="brand">SKIMBA<small>ALPINE RUSH • 01</small></div><div class="stats"><div class="pill"><label>DISTANCE</label><strong id="distance">0 m</strong></div><div class="pill"><label>FLAKES</label><strong id="flakes">0</strong></div><div class="pill"><label>BEST</label><strong id="best">0 m</strong></div></div></div>
  <div class="actions"><button class="icon-btn" id="sound" aria-label="Toggle sound">♫</button><div class="touch-hint">← → TO SLALOM &nbsp; • &nbsp; SPACE TO HOP</div><div class="touch-controls"><button class="touch-btn" id="left" aria-label="Move left">←</button><button class="touch-btn jump" id="jump">HOP</button><button class="touch-btn" id="right" aria-label="Move right">→</button></div><button class="icon-btn" id="pause" aria-label="Pause game">Ⅱ</button></div>
</div>
<div class="overlay" id="overlay"><section class="card" id="card"></section></div>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s),overlay=$('#overlay'),card=$('#card');
let W=0,H=0,dpr=1,last=0,mode='menu',time=0,score=0,flakes=0,best=+(localStorage.getItem('skimba-best')||0),speed=340,spawnAt=0,shake=0,muted=false,audio=null;
const player={x:0,y:0,lean:0,air:0,airTime:0,invuln:0};let objects=[],particles=[],snow=[];
$('#best').textContent=best+' m';
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);player.y=H*.75;player.x=Math.max(-1,Math.min(1,player.x));document.body.classList.toggle('mobile',W<700||('ontouchstart'in window));seedSnow()}
function seedSnow(){snow=Array.from({length:Math.max(28,Math.round(W*H/10000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.5,v:25+Math.random()*70,a:.2+Math.random()*.55}))}
window.addEventListener('resize',resize);resize();
function menu(){mode='menu';overlay.classList.remove('hidden');card.innerHTML=`<div class="eyebrow">A LITTLE MOUNTAIN ADVENTURE</div><div class="title">SKI<span>M</span>BA</div><div class="subtitle">Find your flow, dodge the trees, and scoop up snowflakes on the way down.</div><button class="primary" id="start">HIT THE SLOPES</button><div class="key-row"><span class="key">←</span><span class="key">→</span><span>STEER</span><span style="width:8px"></span><span class="key">SPACE</span><span>HOP</span></div>`;$('#start').onclick=startGame}
function startGame(){mode='playing';overlay.classList.add('hidden');score=0;flakes=0;speed=340;spawnAt=.55;objects=[];particles=[];player.x=0;player.lean=0;player.air=0;player.airTime=0;player.invuln=0;time=0;last=performance.now();beep(540,.07);requestAnimationFrame(loop)}
function showEnd(){mode='over';overlay.classList.remove('hidden');if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem('skimba-best',best);$('#best').textContent=best+' m'}const medal=score>1500?'SLOPE LEGEND':score>700?'NICE LINES':'FIRST RUN';card.innerHTML=`<div class="eyebrow">RUN COMPLETE</div><div class="title">NICE<br>RIDE<span>!</span></div><div class="badge">${medal}</div><div class="result-label">DISTANCE</div><div class="result">${Math.floor(score)}<small style="font-size:20px;color:#75a09b"> m</small></div><div class="subtitle" style="margin:7px auto 18px">You collected <b>${flakes}</b> snowflake${flakes===1?'':'s'}.</div><button class="primary" id="again">GO AGAIN</button><div class="key-row"><span class="key">ENTER</span><span>TO RETRY</span></div>`;$('#again').onclick=startGame}
function pauseGame(){if(mode==='playing'){mode='paused';overlay.classList.remove('hidden');card.innerHTML=`<div class="eyebrow">CATCH YOUR BREATH</div><div class="title" style="font-size:58px">PAUSED</div><div class="subtitle">The mountain will wait.</div><button class="primary" id="resume">BACK TO IT</button><div class="key-row"><span class="key">P</span><span>TO RESUME</span></div>`;$('#resume').onclick=resumeGame}else if(mode==='paused')resumeGame()}
function resumeGame(){mode='playing';overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function beep(freq=450,duration=.08){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='sine';o.frequency.value=freq;g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'♪':'♫';if(!muted)beep(620,.06)};$('#pause').onclick=pauseGame;
function steer(dir){if(mode!=='playing')return;player.x=Math.max(-.84,Math.min(.84,player.x+dir*.34));player.lean=dir;beep(250+Math.random()*70,.035)}
function hop(){if(mode==='playing'&&player.air<=0){player.air=1;player.airTime=.68;beep(680,.09)}}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Space'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer(1);if(e.key===' '||e.key==='ArrowUp'||e.key.toLowerCase()==='w')hop();if(e.key.toLowerCase()==='p'||e.key==='Escape')pauseGame();if(e.key==='Enter'&&(mode==='menu'||mode==='over'))startGame()});
$('#left').onpointerdown=e=>{e.preventDefault();steer(-1)};$('#right').onpointerdown=e=>{e.preventDefault();steer(1)};$('#jump').onpointerdown=e=>{e.preventDefault();hop()};let touchX=null;canvas.addEventListener('touchstart',e=>{if(mode!=='playing')return;touchX=e.changedTouches[0].clientX},{passive:true});canvas.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>24)steer(dx<0?-1:1);touchX=null},{passive:true});
function addObject(kind,x,y){objects.push({kind,x,y,phase:Math.random()*6.28,hit:false})}
function spawn(){const lane=()=>[-.72,-.36,0,.36,.72][Math.floor(Math.random()*5)];let n=Math.random();if(n<.4){addObject('tree',lane(),-80);if(Math.random()<.48)addObject('rock',lane(),-190)}else if(n<.68){addObject('rock',lane(),-70)}else if(n<.88){const x=lane();addObject('flake',x,-75);addObject('flake',x,-140);addObject('flake',x,-205)}else {const x=lane();addObject('gate',x,-80);addObject('flake',x,-180)}}
function update(dt){time+=dt;score+=dt*(speed*.09);speed=Math.min(690,340+score*.055);spawnAt-=dt;if(spawnAt<=0){spawn();spawnAt=Math.max(.48,1.05-score/14000)+Math.random()*.28}player.y=H*.75;player.lean*=Math.pow(.03,dt);if(player.air>0){player.airTime-=dt;player.air=Math.max(0,player.airTime/.68)}if(player.invuln>0)player.invuln-=dt;if(shake>0)shake=Math.max(0,shake-dt*20);
for(let o of objects){o.y+=speed*dt;o.phase+=dt*3;if(o.kind==='flake'&&o.y>player.y-28&&o.y<player.y+28&&!o.hit&&Math.abs(o.x-player.x)<.12){o.hit=true;flakes++;score+=45;burst(o.x,o.y,'#f5c856',9);beep(760,.08)}if((o.kind==='tree'||o.kind==='rock')&&!o.hit&&player.air<.22&&o.y>player.y-24&&o.y<player.y+25&&Math.abs(o.x-player.x)<.18){o.hit=true;shake=9;player.invuln=1.1;score=Math.max(0,score-60);burst(o.x,o.y,'#ff715b',15);beep(130,.23)}if(o.kind==='gate'&&!o.hit&&o.y>player.y-7&&o.y<player.y+12){o.hit=true;if(Math.abs(o.x-player.x)<.2){score+=130;burst(o.x,o.y,'#f6cb65',16);beep(900,.1)}else{shake=4;score=Math.max(0,score-20)}}}objects=objects.filter(o=>o.y<H+130&&!o.hit);
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vy+=45*dt}particles=particles.filter(p=>p.life>0);for(let f of snow){f.y+=(f.v+speed*.08)*dt;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}}$('#distance').textContent=Math.floor(score)+' m';$('#flakes').textContent=flakes}
function burst(x,y,color,n){const sx=W/2+x*W*.39,sy=y;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=40+Math.random()*160;particles.push({x:sx,y:sy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.45+Math.random()*.4,max:.8,size:2+Math.random()*4,color})}}
function path(points,fill){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function drawMountains(){ctx.fillStyle='#b9e2e5';ctx.fillRect(0,0,W,H);const sunX=W*.77,sunY=H*.13;ctx.fillStyle='#ffe9ae';ctx.beginPath();ctx.arc(sunX,sunY,Math.min(W,H)*.065,0,7);ctx.fill();path([[0,H*.36],[W*.12,H*.17],[W*.22,H*.29],[W*.38,H*.1],[W*.52,H*.34],[W*.67,H*.18],[W*.83,H*.35],[W,H*.15],[W,H*.57],[0,H*.57]],'#a1cfd1');path([[0,H*.45],[W*.16,H*.26],[W*.29,H*.42],[W*.43,H*.2],[W*.59,H*.43],[W*.75,H*.24],[W,H*.45],[W,H*.62],[0,H*.62]],'#8ebfc3');for(let i=0;i<5;i++){let x=W*(.06+i*.22),y=H*(.18+(i%2)*.12);path([[x-35,y+55],[x,y],[x+38,y+58],[x+16,y+47],[x,y+20],[x-17,y+47]],'#f7fcf4')}
// broad curving trail
const curve=Math.sin(time*.23)*W*.035,cx=W*.5+curve;path([[cx-W*.58,-30],[cx+W*.58,-30],[cx+W*.43,H*.48],[cx+W*.28,H*.72],[cx+W*.42,H+30],[cx-W*.42,H+30],[cx-W*.28,H*.72],[cx-W*.43,H*.48]],'#f8fbf2');ctx.strokeStyle='rgba(155,197,188,.42)';ctx.lineWidth=2;for(let i=0;i<5;i++){let y=((i*180+time*speed*.38)%(H+200))-100;let x=cx+Math.sin(y*.004+time*.2)*W*.07;ctx.beginPath();ctx.moveTo(x-W*.3,y);ctx.quadraticCurveTo(x,y+15,x+W*.3,y);ctx.stroke()}
// fir tree decorations
for(let i=0;i<18;i++){let y=((i*117+time*speed*.6)%(H+120))-60;let side=i%2?-1:1;let x=cx+side*(W*.46+Math.sin(y*.004+i)*W*.07);drawTree(x,y,Math.max(14,32-y/H*10),.65)}}
function drawTree(x,y,s,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#557d70';ctx.fillRect(x-s*.09,y,s*.18,s*.45);ctx.fillStyle='#467a72';for(let j=0;j<3;j++){let yy=y-s*.2+j*s*.27;ctx.beginPath();ctx.moveTo(x,yy-s*.6);ctx.lineTo(x-s*(.47-j*.07),yy+s*.2);ctx.lineTo(x+s*(.47-j*.07),yy+s*.2);ctx.closePath();ctx.fill()}ctx.fillStyle='#f7fbef';ctx.beginPath();ctx.moveTo(x, y-s*.55);ctx.lineTo(x-s*.17,y-s*.05);ctx.lineTo(x+s*.18,y-s*.05);ctx.closePath();ctx.fill();ctx.restore()}
function worldX(x){return W*.5+Math.sin(time*.23)*W*.035+x*W*.39}
function drawObject(o){const y=o.y,p=Math.max(.42,Math.min(1.65,.45+y/H*.9)),x=worldX(o.x),s=32*p;ctx.save();if(o.kind==='tree'){ctx.fillStyle='rgba(47,83,78,.12)';ctx.beginPath();ctx.ellipse(x,y+4,s*.55,s*.19,0,0,7);ctx.fill();drawTree(x,y,s,1)}else if(o.kind==='rock'){ctx.fillStyle='rgba(47,83,78,.12)';ctx.beginPath();ctx.ellipse(x,y+4,s*.48,s*.2,0,0,7);ctx.fill();ctx.fillStyle='#8caaa2';ctx.beginPath();ctx.moveTo(x-s*.45,y+s*.12);ctx.lineTo(x-s*.37,y-s*.22);ctx.lineTo(x-s*.08,y-s*.44);ctx.lineTo(x+s*.3,y-s*.32);ctx.lineTo(x+s*.49,y+s*.1);ctx.closePath();ctx.fill();ctx.fillStyle='#d9e8db';ctx.beginPath();ctx.moveTo(x-s*.35,y-s*.18);ctx.lineTo(x-s*.08,y-s*.44);ctx.lineTo(x+s*.08,y-s*.16);ctx.closePath();ctx.fill()}else if(o.kind==='flake'){const r=10*p;ctx.translate(x,y+Math.sin(o.phase)*3);ctx.rotate(o.phase*.3);ctx.fillStyle='#fff9dc';ctx.strokeStyle='#e7b749';ctx.lineWidth=2*p;ctx.beginPath();for(let i=0;i<6;i++){let a=i*Math.PI/3;ctx.moveTo(Math.cos(a)*r*.35,Math.sin(a)*r*.35);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.18,0,7);ctx.fillStyle='#f5c856';ctx.fill()}else if(o.kind==='gate'){ctx.strokeStyle='#f07b62';ctx.lineWidth=5*p;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-s*.68,y+s*.25);ctx.lineTo(x-s*.5,y-s*.82);ctx.lineTo(x+s*.5,y-s*.82);ctx.lineTo(x+s*.68,y+s*.25);ctx.stroke();ctx.fillStyle='#fff8e9';ctx.fillRect(x-s*.51,y-s*.84,s*1.03,8*p);ctx.fillStyle='#f07b62';for(let k=0;k<4;k++)ctx.fillRect(x-s*.48+k*s*.26,y-s*.82,s*.12,5*p)}ctx.restore()}
function drawPlayer(){const x=worldX(player.x),y=player.y-(player.air>0?player.air*49:0),s=Math.max(1,Math.min(W,H)*.001);ctx.save();ctx.translate(x,y);if(player.air===0){ctx.fillStyle='rgba(33,69,72,.16)';ctx.beginPath();ctx.ellipse(0,18,24,7,0,0,7);ctx.fill()}ctx.rotate(player.lean*.12);const scale=s*(player.air>0?1.06:1);ctx.scale(scale,scale);if(player.invuln>0&&Math.floor(time*15)%2)ctx.globalAlpha=.5;
// skis
ctx.strokeStyle='#ee705c';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,21);ctx.lineTo(22,25);ctx.stroke();ctx.strokeStyle='#f2bd54';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-23,27);ctx.lineTo(18,31);ctx.stroke();
// body jacket
ctx.fillStyle='#f26f5b';ctx.beginPath();ctx.ellipse(0,1,13,19,-.12,0,7);ctx.fill();ctx.fillStyle='#fff4df';ctx.beginPath();ctx.arc(0,-19,10,0,7);ctx.fill();ctx.fillStyle='#294d55';ctx.beginPath();ctx.arc(0,-21,10,Math.PI,0);ctx.lineTo(11,-16);ctx.lineTo(-11,-16);ctx.fill();ctx.fillStyle='#6fc5bc';ctx.fillRect(-12,-7,7,3);ctx.fillRect(5,-8,8,3);ctx.strokeStyle='#244e55';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-10,6);ctx.lineTo(-19,15);ctx.moveTo(10,6);ctx.lineTo(18,11);ctx.stroke();ctx.restore()}
function draw(){ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawMountains();for(const o of objects)drawObject(o);drawPlayer();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/(p.max||.8));ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;for(const f of snow){ctx.globalAlpha=f.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();if(mode==='menu'){// tiny idle skier
ctx.save();ctx.globalAlpha=.4;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(W*.5,H*.77,80,14,0,0,7);ctx.fill();ctx.restore()}}
function loop(now){if(mode!=='playing')return;const dt=Math.min(.034,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
function idle(){if(mode==='playing')return;time+=.006;draw();requestAnimationFrame(idle)}
menu();idle();
})();
</script>
</body>
</html>
